<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Monopoly Snake</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville:wght@400;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #1a1a1a;
    font-family: 'Libre Baskerville', 'Georgia', serif;
    overflow: hidden;
    height: 100%;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Score card — above canvas */
  #scoreCard {
    background: #F5F0DC;
    border: 2px solid #8B6914;
    border-radius: 3px;
    padding: 6px 18px;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.4);
    text-align: center;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  #scoreCard .label {
    font-family: 'Playfair Display', serif;
    font-size: 10px;
    color: #8B6914;
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }
  #score {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    color: #1a5e1a;
  }
  #highScore {
    font-family: 'Libre Baskerville', serif;
    font-size: 10px;
    color: #999;
  }

  /* Canvas wrapper for overlays */
  #canvasWrap {
    position: relative;
    flex-shrink: 0;
  }
  canvas {
    display: block;
    border: 3px solid #8B6914;
    border-radius: 2px;
    box-shadow: 0 0 30px rgba(139,105,20,0.3);
  }

  /* Overlays are relative to canvas */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 2px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    background: rgba(0,0,0,0.75);
  }
  #overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #chanceCard {
    background: #FFF8E7;
    border: 4px solid #E87511;
    border-radius: 8px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    max-width: 90%;
    position: relative;
  }
  #chanceCard::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 2px solid #E87511;
    border-radius: 4px;
    pointer-events: none;
  }
  #chanceCard .cardTitle {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: #E87511;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 12px;
  }
  #chanceCard h1 {
    font-family: 'Playfair Display', serif;
    color: #c0392b;
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 10px;
  }
  #chanceCard .finalScore {
    font-family: 'Playfair Display', serif;
    color: #333;
    font-size: 18px;
    margin-bottom: 6px;
  }
  #chanceCard .newHigh {
    color: #8B6914;
    font-size: 13px;
    margin-bottom: 18px;
    min-height: 18px;
    font-style: italic;
  }
  #chanceCard button {
    background: #1a5e1a;
    color: #F5F0DC;
    border: 2px solid #8B6914;
    padding: 10px 32px;
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #chanceCard button:hover { background: #237a23; transform: scale(1.05); }
  #chanceCard button:active { transform: scale(0.97); }

  #startOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.82);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 2px;
    z-index: 3;
  }
  #startCard {
    background: #F5F0DC;
    border: 4px solid #8B6914;
    border-radius: 8px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    position: relative;
    max-width: 90%;
  }
  #startCard::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 2px solid #8B6914;
    border-radius: 4px;
    pointer-events: none;
  }
  #startCard h1 {
    font-family: 'Playfair Display', serif;
    color: #c0392b;
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  #startCard .subtitle {
    font-family: 'Playfair Display', serif;
    color: #8B6914;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  #startCard p {
    color: #666;
    font-size: 12px;
    margin-bottom: 20px;
  }
  #startCard button {
    background: #1a5e1a;
    color: #F5F0DC;
    border: 2px solid #8B6914;
    padding: 12px 40px;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #startCard button:hover { background: #237a23; transform: scale(1.05); }

  /* D-pad — hidden on desktop */
  #dpad {
    display: none;
    margin-top: 12px;
    flex-shrink: 0;
  }
  #dpadGrid {
    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px 64px;
    gap: 4px;
  }
  .dpad-btn {
    background: rgba(245,240,220,0.12);
    border: 2px solid rgba(139,105,20,0.4);
    border-radius: 10px;
    color: #F5F0DC;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(139,105,20,0.35);
    border-color: #8B6914;
  }
  .dpad-empty {
    background: transparent;
    border: none;
  }

  /* Mobile responsive */
  @media (max-width: 600px), (hover: none) and (pointer: coarse) {
    body {
      justify-content: flex-start;
      padding-top: 8px;
    }
    #dpad {
      display: block;
    }
    #scoreCard {
      margin-bottom: 6px;
      padding: 4px 14px;
    }
    #score {
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<div id="scoreCard">
  <div>
    <div class="label">Treasury</div>
    <div id="score">$0</div>
  </div>
  <div id="highScore">Best: $0</div>
</div>

<div id="canvasWrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <div id="chanceCard">
      <div class="cardTitle">Chance</div>
      <h1>BANKRUPT!</h1>
      <div class="finalScore">Final Balance: $0</div>
      <div class="newHigh"></div>
      <button id="restartBtn">Roll Again</button>
    </div>
  </div>
  <div id="startOverlay">
    <div id="startCard">
      <h1>Monopoly</h1>
      <div class="subtitle">Snake Edition</div>
      <p>Arrow keys, WASD, swipe, or D-pad</p>
      <button id="startBtn">Pass Go</button>
    </div>
  </div>
</div>

<div id="dpad">
  <div id="dpadGrid">
    <div class="dpad-empty"></div>
    <div class="dpad-btn" data-dir="up">&#9650;</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" data-dir="left">&#9664;</div>
    <div class="dpad-empty dpad-center"></div>
    <div class="dpad-btn" data-dir="right">&#9654;</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" data-dir="down">&#9660;</div>
    <div class="dpad-empty"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 30;
const ROWS = 30;
const CELL = 18;
const W = COLS * CELL;
const H = ROWS * CELL;
canvas.width = W;
canvas.height = H;

// Responsive scaling
function resizeCanvas() {
  const isMobile = window.innerWidth <= 600 || (matchMedia('(hover: none) and (pointer: coarse)').matches);
  const scoreH = document.getElementById('scoreCard').offsetHeight;
  const dpadH = isMobile ? 210 : 0;
  const padV = isMobile ? 30 : 40;
  const maxW = window.innerWidth - 16;
  const maxH = window.innerHeight - scoreH - dpadH - padV;
  const scale = Math.min(maxW / W, maxH / H, 1);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const overlay = document.getElementById('overlay');
const startOverlay = document.getElementById('startOverlay');
const restartBtn = document.getElementById('restartBtn');
const startBtn = document.getElementById('startBtn');

const BOARD_COLORS = [
  '#8B4513','#87CEEB','#D81B60','#FF8F00',
  '#E53935','#FFEB3B','#388E3C','#1565C0',
];

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playCashRegister() {
  const t = audioCtx.currentTime;
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.connect(g1); g1.connect(audioCtx.destination);
  o1.type = 'square';
  o1.frequency.setValueAtTime(2200, t);
  o1.frequency.setValueAtTime(2600, t + 0.03);
  g1.gain.setValueAtTime(0.08, t);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o1.start(t); o1.stop(t + 0.12);
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.type = 'sine';
  o2.frequency.setValueAtTime(3400, t + 0.02);
  o2.frequency.exponentialRampToValueAtTime(2800, t + 0.2);
  g2.gain.setValueAtTime(0.1, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o2.start(t + 0.02); o2.stop(t + 0.25);
  const o3 = audioCtx.createOscillator();
  const g3 = audioCtx.createGain();
  o3.connect(g3); g3.connect(audioCtx.destination);
  o3.type = 'sine';
  o3.frequency.setValueAtTime(150, t + 0.05);
  o3.frequency.exponentialRampToValueAtTime(80, t + 0.15);
  g3.gain.setValueAtTime(0.12, t + 0.05);
  g3.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o3.start(t + 0.05); o3.stop(t + 0.18);
}

function playSadTrombone() {
  const t = audioCtx.currentTime;
  const notes = [
    { freq: 294, start: 0, dur: 0.3 },
    { freq: 277, start: 0.3, dur: 0.3 },
    { freq: 262, start: 0.6, dur: 0.3 },
    { freq: 247, start: 0.9, dur: 0.6 },
  ];
  notes.forEach((n, idx) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(n.freq, t + n.start);
    if (idx === 3) {
      const lfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      lfo.connect(lfoGain);
      lfoGain.connect(o.frequency);
      lfo.frequency.value = 5;
      lfoGain.gain.value = 4;
      lfo.start(t + n.start);
      lfo.stop(t + n.start + n.dur);
    }
    g.gain.setValueAtTime(0.1, t + n.start);
    g.gain.setValueAtTime(0.1, t + n.start + n.dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + n.start + n.dur);
    o.start(t + n.start);
    o.stop(t + n.start + n.dur);
  });
}

// State
let snake, dir, nextDir, food, score, highScore, gameOver, running, lastTick, interval;
let eatAnim = 0;
let particles = [];
let floatingTexts = [];
let foodType = 0;

highScore = parseInt(localStorage.getItem('monopolySnakeHighScore')) || 0;
highScoreEl.textContent = 'Best: $' + (highScore * 100);

function init() {
  const midX = Math.floor(COLS / 2);
  const midY = Math.floor(ROWS / 2);
  snake = [
    { x: midX, y: midY },
    { x: midX - 1, y: midY },
    { x: midX - 2, y: midY },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  eatAnim = 0;
  particles = [];
  floatingTexts = [];
  scoreEl.textContent = '$0';
  overlay.classList.remove('visible');
  placeFood();
  interval = 120;
}

function placeFood() {
  const occupied = new Set(snake.map(s => s.x + ',' + s.y));
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (occupied.has(pos.x + ',' + pos.y));
  food = pos;
  foodType = Math.random() > 0.5 ? 1 : 0;
}

function spawnParticles(x, y) {
  for (let i = 0; i < 10; i++) {
    const angle = (Math.PI * 2 / 10) * i + Math.random() * 0.4;
    particles.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vx: Math.cos(angle) * (1.5 + Math.random() * 2),
      vy: Math.sin(angle) * (1.5 + Math.random() * 2),
      life: 1,
      color: Math.random() > 0.5 ? '#FFD700' : '#1a5e1a',
    });
  }
}

function spawnFloatingText(x, y, text) {
  floatingTexts.push({
    x: x * CELL + CELL / 2,
    y: y * CELL,
    text: text,
    life: 1,
  });
}

function update() {
  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) { endGame(); return; }
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    const cashVal = foodType === 1 ? 200 : 100;
    scoreEl.textContent = '$' + (score * 100);
    eatAnim = 8;
    spawnParticles(food.x, food.y);
    spawnFloatingText(food.x, food.y, '+$' + cashVal);
    playCashRegister();
    placeFood();
    interval = Math.max(50, 120 - score * 2);
  } else {
    snake.pop();
  }
}

function endGame() {
  gameOver = true;
  playSadTrombone();
  let isNew = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('monopolySnakeHighScore', highScore);
    highScoreEl.textContent = 'Best: $' + (highScore * 100);
    isNew = true;
  }
  document.querySelector('#chanceCard .finalScore').textContent = 'Final Balance: $' + (score * 100);
  document.querySelector('#chanceCard .newHigh').textContent = isNew ? 'New Record Fortune!' : '';
  overlay.classList.add('visible');
}

// Drawing functions

function drawBoard() {
  ctx.fillStyle = '#0C3B2E';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W, y * CELL); ctx.stroke();
  }
  const stripH = 4;
  const segW = W / 8;
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = BOARD_COLORS[i]; ctx.globalAlpha = 0.35;
    ctx.fillRect(i * segW, 0, segW, stripH);
  }
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = BOARD_COLORS[7 - i]; ctx.globalAlpha = 0.35;
    ctx.fillRect(i * segW, H - stripH, segW, stripH);
  }
  const segH = H / 8;
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = BOARD_COLORS[(i + 2) % 8]; ctx.globalAlpha = 0.35;
    ctx.fillRect(0, i * segH, stripH, segH);
  }
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = BOARD_COLORS[(i + 4) % 8]; ctx.globalAlpha = 0.35;
    ctx.fillRect(W - stripH, i * segH, stripH, segH);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(0, 0, W, H);
}

function drawDollarBill(cx, cy, size, pulse) {
  const w = size * 1.6 * pulse;
  const h = size * 0.9 * pulse;
  ctx.fillStyle = '#2E7D32';
  ctx.beginPath(); ctx.roundRect(cx - w/2, cy - h/2, w, h, 2); ctx.fill();
  ctx.strokeStyle = '#4CAF50'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.roundRect(cx - w/2 + 2, cy - h/2 + 2, w - 4, h - 4, 1); ctx.stroke();
  ctx.fillStyle = '#A5D6A7';
  ctx.font = `bold ${Math.round(h * 0.7)}px 'Playfair Display', serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', cx, cy);
}

function drawGoldCoin(cx, cy, size, pulse) {
  const r = size * 0.7 * pulse;
  const glow = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 2.2);
  glow.addColorStop(0, 'rgba(255,215,0,0.3)'); glow.addColorStop(1, 'rgba(255,215,0,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2); ctx.fill();
  const coinGrad = ctx.createRadialGradient(cx - r*0.3, cy - r*0.3, 0, cx, cy, r);
  coinGrad.addColorStop(0, '#FFF176'); coinGrad.addColorStop(0.5, '#FFD700'); coinGrad.addColorStop(1, '#B8860B');
  ctx.fillStyle = coinGrad; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#8B6914';
  ctx.font = `bold ${Math.round(r * 1.2)}px 'Playfair Display', serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', cx, cy);
}

function drawMonopolyMan(cx, cy, size, facingDir) {
  const s = size * 0.85;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(0, s * 0.15, s * 0.35, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#F5F0DC';
  ctx.beginPath(); ctx.ellipse(0, -s * 0.02, s * 0.12, s * 0.08, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#8B1A1A';
  ctx.beginPath(); ctx.moveTo(-s*0.04, s*0.02); ctx.lineTo(s*0.04, s*0.02); ctx.lineTo(0, s*0.12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FDDCB5';
  ctx.beginPath(); ctx.arc(0, -s * 0.2, s * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(0, -s * 0.38, s * 0.28, s * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(-s * 0.17, -s * 0.65, s * 0.34, s * 0.28);
  ctx.beginPath(); ctx.ellipse(0, -s * 0.65, s * 0.17, s * 0.04, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(-s * 0.17, -s * 0.42, s * 0.34, s * 0.03);
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.moveTo(-s*0.15, -s*0.12);
  ctx.quadraticCurveTo(-s*0.18, -s*0.18, -s*0.08, -s*0.15);
  ctx.quadraticCurveTo(0, -s*0.12, 0, -s*0.13);
  ctx.quadraticCurveTo(0, -s*0.12, s*0.08, -s*0.15);
  ctx.quadraticCurveTo(s*0.18, -s*0.18, s*0.15, -s*0.12);
  ctx.quadraticCurveTo(s*0.1, -s*0.08, 0, -s*0.1);
  ctx.quadraticCurveTo(-s*0.1, -s*0.08, -s*0.15, -s*0.12);
  ctx.fill();
  const monocleX = s * 0.09, monocleY = -s * 0.22;
  ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(monocleX, monocleY, s * 0.07, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(200,230,255,0.25)';
  ctx.beginPath(); ctx.arc(monocleX, monocleY, s * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(monocleX + s*0.06, monocleY + s*0.03); ctx.lineTo(s*0.2, s*0.05); ctx.stroke();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(-s*0.07, -s*0.22, s*0.025, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.09, -s*0.22, s*0.025, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(0, -s*0.14, s*0.06, 0.1, Math.PI - 0.1); ctx.stroke();
  ctx.restore();
}

function drawNecktieTail(segments) {
  if (segments.length < 2) return;
  for (let i = segments.length - 1; i >= 1; i--) {
    const s = segments[i];
    const t = i / segments.length;
    const tieWidth = CELL * 0.7 * (1 - t * 0.6);
    const cx = s.x * CELL + CELL / 2;
    const cy = s.y * CELL + CELL / 2;
    const prev = segments[i - 1];
    const dx = s.x - prev.x;
    const dy = s.y - prev.y;
    const darkness = 0.3 + t * 0.4;
    const r = Math.round(139 * (1 - darkness) + 60 * darkness);
    const g = Math.round(26 * (1 - darkness) + 10 * darkness);
    const b = Math.round(26 * (1 - darkness) + 15 * darkness);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    if (dx !== 0) {
      ctx.beginPath();
      ctx.moveTo(-CELL*0.45, -tieWidth/2); ctx.lineTo(CELL*0.45, -tieWidth/2);
      ctx.lineTo(CELL*0.45, tieWidth/2); ctx.lineTo(-CELL*0.45, tieWidth/2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = `rgba(200,180,50,${0.2*(1-t)})`; ctx.lineWidth = 1;
      for (let stripe = -2; stripe <= 2; stripe++) {
        ctx.beginPath(); ctx.moveTo(stripe*4-3, -tieWidth/2); ctx.lineTo(stripe*4+3, tieWidth/2); ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(-tieWidth/2, -CELL*0.45); ctx.lineTo(tieWidth/2, -CELL*0.45);
      ctx.lineTo(tieWidth/2, CELL*0.45); ctx.lineTo(-tieWidth/2, CELL*0.45);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = `rgba(200,180,50,${0.2*(1-t)})`; ctx.lineWidth = 1;
      for (let stripe = -2; stripe <= 2; stripe++) {
        ctx.beginPath(); ctx.moveTo(-tieWidth/2, stripe*4-3); ctx.lineTo(tieWidth/2, stripe*4+3); ctx.stroke();
      }
    }
    ctx.restore();
    if (i === segments.length - 1) {
      const tipW = tieWidth * 0.5;
      ctx.save(); ctx.translate(cx, cy);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      if (dx > 0) { ctx.beginPath(); ctx.moveTo(CELL*0.45,-tipW/2); ctx.lineTo(CELL*0.7,0); ctx.lineTo(CELL*0.45,tipW/2); ctx.closePath(); ctx.fill(); }
      else if (dx < 0) { ctx.beginPath(); ctx.moveTo(-CELL*0.45,-tipW/2); ctx.lineTo(-CELL*0.7,0); ctx.lineTo(-CELL*0.45,tipW/2); ctx.closePath(); ctx.fill(); }
      else if (dy > 0) { ctx.beginPath(); ctx.moveTo(-tipW/2,CELL*0.45); ctx.lineTo(0,CELL*0.7); ctx.lineTo(tipW/2,CELL*0.45); ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(-tipW/2,-CELL*0.45); ctx.lineTo(0,-CELL*0.7); ctx.lineTo(tipW/2,-CELL*0.45); ctx.closePath(); ctx.fill(); }
      ctx.restore();
    }
  }
}

function draw() {
  drawBoard();
  const pulse = 1 + Math.sin(performance.now() / 200) * 0.1;
  const fx = food.x * CELL + CELL / 2;
  const fy = food.y * CELL + CELL / 2;
  if (foodType === 0) drawDollarBill(fx, fy, CELL * 0.55, pulse);
  else drawGoldCoin(fx, fy, CELL * 0.5, pulse);
  drawNecktieTail(snake);
  if (snake.length > 0) {
    const head = snake[0];
    const hx = head.x * CELL + CELL / 2;
    const hy = head.y * CELL + CELL / 2;
    const headScale = eatAnim > 0 ? CELL * 1.15 : CELL;
    drawMonopolyMan(hx, hy, headScale, dir);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.03;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.font = `bold ${Math.round(8 * p.life)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', p.x, p.y);
  }
  ctx.globalAlpha = 1;
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.2; ft.life -= 0.018;
    if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = '#FFD700'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.font = "bold 14px 'Playfair Display', serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;
  if (eatAnim > 0) eatAnim--;
}

function gameLoop(ts) {
  if (!running) return;
  if (!lastTick) lastTick = ts;
  if (ts - lastTick >= interval) {
    lastTick = ts;
    if (!gameOver) update();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  init();
  running = true;
  lastTick = 0;
  requestAnimationFrame(gameLoop);
}

// --- Input: Keyboard ---
function setDir(newDir) {
  if (newDir === 'up' && dir.y === 0) nextDir = { x: 0, y: -1 };
  else if (newDir === 'down' && dir.y === 0) nextDir = { x: 0, y: 1 };
  else if (newDir === 'left' && dir.x === 0) nextDir = { x: -1, y: 0 };
  else if (newDir === 'right' && dir.x === 0) nextDir = { x: 1, y: 0 };
}

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(key)) e.preventDefault();
  if (key === 'ArrowUp' || key === 'w') setDir('up');
  else if (key === 'ArrowDown' || key === 's') setDir('down');
  else if (key === 'ArrowLeft' || key === 'a') setDir('left');
  else if (key === 'ArrowRight' || key === 'd') setDir('right');
});

// --- Input: D-pad buttons ---
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const d = btn.dataset.dir;
  const handler = (e) => {
    e.preventDefault();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    setDir(d);
  };
  btn.addEventListener('touchstart', handler, { passive: false });
  btn.addEventListener('mousedown', handler);
});

// --- Input: Swipe gestures on canvas ---
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  if (dt > 500) return; // too slow
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return; // too short
  if (absDx > absDy) {
    setDir(dx > 0 ? 'right' : 'left');
  } else {
    setDir(dy > 0 ? 'down' : 'up');
  }
}, { passive: true });

// Prevent scrolling on touch
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

restartBtn.addEventListener('click', startGame);
startBtn.addEventListener('click', () => {
  startOverlay.remove();
  startGame();
});

// Initial resize after fonts load
document.fonts && document.fonts.ready.then(resizeCanvas);
</script>
