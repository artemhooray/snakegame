<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>South Park Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #1a1a1a;
    font-family: 'Arial', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    height: 100%;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Score card — South Park episode title style */
  #scoreCard {
    background: #000;
    border: 2px solid #333;
    border-radius: 3px;
    padding: 6px 20px;
    box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    text-align: center;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }
  #score {
    font-family: 'Arial Black', 'Arial', sans-serif;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.5px;
  }
  #highScore {
    font-family: 'Arial', sans-serif;
    font-size: 11px;
    color: #888;
  }

  /* Canvas wrapper */
  #canvasWrap {
    position: relative;
    flex-shrink: 0;
  }
  canvas {
    display: block;
    border: 3px solid #333;
    border-radius: 2px;
  }

  /* Game Over overlay */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 2px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    background: rgba(0,0,0,0.85);
  }
  #overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #gameOverCard {
    background: #111;
    border: 4px solid #cc0000;
    border-radius: 8px;
    padding: 28px 32px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    max-width: 92%;
    position: relative;
  }
  #gameOverCard h1 {
    font-family: 'Arial Black', 'Arial', sans-serif;
    color: #ff3333;
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  #gameOverCard .subtitle {
    font-family: 'Arial', sans-serif;
    color: #ff9900;
    font-size: 18px;
    font-style: italic;
    margin-bottom: 14px;
  }
  #gameOverCard .finalScore {
    font-family: 'Arial Black', 'Arial', sans-serif;
    color: #fff;
    font-size: 18px;
    margin-bottom: 6px;
  }
  #gameOverCard .newHigh {
    color: #ffcc00;
    font-size: 13px;
    margin-bottom: 18px;
    min-height: 18px;
    font-style: italic;
  }
  #gameOverCard button {
    background: #cc0000;
    color: #fff;
    border: 2px solid #ff3333;
    padding: 10px 24px;
    font-family: 'Arial Black', 'Arial', sans-serif;
    font-size: 13px;
    font-weight: 900;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #gameOverCard button:hover { background: #e60000; transform: scale(1.05); }
  #gameOverCard button:active { transform: scale(0.97); }

  /* Start overlay */
  #startOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 2px;
    z-index: 3;
  }
  #startCard {
    background: #111;
    border: 4px solid #ff6600;
    border-radius: 8px;
    padding: 30px 40px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    max-width: 92%;
  }
  #startCard h1 {
    font-family: 'Arial Black', 'Arial', sans-serif;
    color: #ff3333;
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  #startCard .subtitle {
    font-family: 'Arial', sans-serif;
    color: #ff9900;
    font-size: 14px;
    margin-bottom: 16px;
    font-style: italic;
  }
  #startCard p {
    color: #888;
    font-size: 12px;
    margin-bottom: 20px;
  }
  #startCard button {
    background: #cc0000;
    color: #fff;
    border: 2px solid #ff3333;
    padding: 12px 32px;
    font-family: 'Arial Black', 'Arial', sans-serif;
    font-size: 15px;
    font-weight: 900;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    text-transform: uppercase;
  }
  #startCard button:hover { background: #e60000; transform: scale(1.05); }

  /* D-pad */
  #dpad {
    display: none;
    margin-top: 12px;
    flex-shrink: 0;
  }
  #dpadGrid {
    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px 64px;
    gap: 4px;
  }
  .dpad-btn {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: #fff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(204,0,0,0.3);
    border-color: #cc0000;
  }
  .dpad-empty { background: transparent; border: none; }

  @media (max-width: 600px), (hover: none) and (pointer: coarse) {
    body { justify-content: flex-start; padding-top: 8px; }
    #dpad { display: block; }
    #scoreCard { margin-bottom: 6px; padding: 4px 14px; }
    #score { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="scoreCard">
  <div id="score">Cheesy Poofs: 0</div>
  <div id="highScore">Best: 0</div>
</div>

<div id="canvasWrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <div id="gameOverCard">
      <h1>OH MY GOD, THEY KILLED KENNY!</h1>
      <div class="subtitle">You bastards!</div>
      <div class="finalScore">Cheesy Poofs: 0</div>
      <div class="newHigh"></div>
      <button id="restartBtn">Respect Mah Authoritah</button>
    </div>
  </div>
  <div id="startOverlay">
    <div id="startCard">
      <h1>South Park</h1>
      <div class="subtitle">Snake Edition</div>
      <p>Arrow keys, WASD, swipe, or D-pad</p>
      <button id="startBtn">Respect Mah Authoritah</button>
    </div>
  </div>
</div>

<div id="dpad">
  <div id="dpadGrid">
    <div class="dpad-empty"></div>
    <div class="dpad-btn" data-dir="up">&#9650;</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" data-dir="left">&#9664;</div>
    <div class="dpad-empty dpad-center"></div>
    <div class="dpad-btn" data-dir="right">&#9654;</div>
    <div class="dpad-empty"></div>
    <div class="dpad-btn" data-dir="down">&#9660;</div>
    <div class="dpad-empty"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const COLS = 30;
const ROWS = 30;
const CELL = 18;
const W = COLS * CELL;
const H = ROWS * CELL;
canvas.width = W;
canvas.height = H;

function resizeCanvas() {
  const isMobile = window.innerWidth <= 600 || matchMedia('(hover: none) and (pointer: coarse)').matches;
  const scoreH = document.getElementById('scoreCard').offsetHeight;
  const dpadH = isMobile ? 210 : 0;
  const padV = isMobile ? 30 : 40;
  const maxW = window.innerWidth - 16;
  const maxH = window.innerHeight - scoreH - dpadH - padV;
  const scale = Math.min(maxW / W, maxH / H, 1);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const overlay = document.getElementById('overlay');
const startOverlay = document.getElementById('startOverlay');
const restartBtn = document.getElementById('restartBtn');
const startBtn = document.getElementById('startBtn');

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playCollectSound() {
  // Synthesized "Mmkay" — nasal hum rising then falling
  const t = audioCtx.currentTime;
  // Nasal "mmm" part
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.connect(g1); g1.connect(audioCtx.destination);
  o1.type = 'sawtooth';
  o1.frequency.setValueAtTime(180, t);
  o1.frequency.linearRampToValueAtTime(200, t + 0.12);
  g1.gain.setValueAtTime(0.08, t);
  g1.gain.setValueAtTime(0.08, t + 0.1);
  g1.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o1.start(t); o1.stop(t + 0.15);

  // "kay" part — higher pitched
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.type = 'sine';
  o2.frequency.setValueAtTime(400, t + 0.13);
  o2.frequency.linearRampToValueAtTime(340, t + 0.3);
  g2.gain.setValueAtTime(0.001, t + 0.13);
  g2.gain.linearRampToValueAtTime(0.12, t + 0.16);
  g2.gain.setValueAtTime(0.12, t + 0.22);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
  o2.start(t + 0.13); o2.stop(t + 0.32);

  // Nasal resonance on "kay"
  const o3 = audioCtx.createOscillator();
  const g3 = audioCtx.createGain();
  o3.connect(g3); g3.connect(audioCtx.destination);
  o3.type = 'square';
  o3.frequency.setValueAtTime(800, t + 0.14);
  o3.frequency.linearRampToValueAtTime(680, t + 0.28);
  g3.gain.setValueAtTime(0.03, t + 0.14);
  g3.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o3.start(t + 0.14); o3.stop(t + 0.3);
}

function playDeathSound() {
  // Sad tuba — descending notes
  const t = audioCtx.currentTime;
  const notes = [
    { freq: 233, start: 0, dur: 0.25 },
    { freq: 220, start: 0.25, dur: 0.25 },
    { freq: 196, start: 0.5, dur: 0.25 },
    { freq: 147, start: 0.75, dur: 0.5 },
  ];
  notes.forEach((n, idx) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(n.freq, t + n.start);
    if (idx === 3) {
      o.frequency.linearRampToValueAtTime(130, t + n.start + n.dur);
      const lfo = audioCtx.createOscillator();
      const lg = audioCtx.createGain();
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.frequency.value = 4; lg.gain.value = 3;
      lfo.start(t + n.start); lfo.stop(t + n.start + n.dur);
    }
    g.gain.setValueAtTime(0.12, t + n.start);
    g.gain.setValueAtTime(0.12, t + n.start + n.dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.001, t + n.start + n.dur);
    o.start(t + n.start); o.stop(t + n.start + n.dur);
  });
}

// State
let snake, dir, nextDir, food, score, highScore, gameOver, running, lastTick, interval;
let eatAnim = 0;
let particles = [];
let floatingTexts = [];

highScore = parseInt(localStorage.getItem('spSnakeHighScore')) || 0;
highScoreEl.textContent = 'Best: ' + highScore;

function init() {
  const midX = Math.floor(COLS / 2);
  const midY = Math.floor(ROWS / 2);
  snake = [
    { x: midX, y: midY },
    { x: midX - 1, y: midY },
    { x: midX - 2, y: midY },
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  gameOver = false;
  eatAnim = 0;
  particles = [];
  floatingTexts = [];
  scoreEl.textContent = 'Cheesy Poofs: 0';
  overlay.classList.remove('visible');
  placeFood();
  interval = 120;
}

function placeFood() {
  const occupied = new Set(snake.map(s => s.x + ',' + s.y));
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (occupied.has(pos.x + ',' + pos.y));
  food = pos;
}

function spawnParticles(x, y) {
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 / 8) * i + Math.random() * 0.5;
    particles.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vx: Math.cos(angle) * (1.5 + Math.random() * 2),
      vy: Math.sin(angle) * (1.5 + Math.random() * 2),
      life: 1,
      color: Math.random() > 0.5 ? '#FF8C00' : '#FFA500',
    });
  }
}

function spawnFloatingText(x, y) {
  const texts = ['SWEET!', 'SWEET!', 'SWEET!', 'RESPECT MAH AUTHORITAH!'];
  floatingTexts.push({
    x: x * CELL + CELL / 2,
    y: y * CELL,
    text: texts[Math.floor(Math.random() * texts.length)],
    life: 1,
  });
}

function update() {
  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) { endGame(); return; }
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Cheesy Poofs: ' + score;
    eatAnim = 8;
    spawnParticles(food.x, food.y);
    spawnFloatingText(food.x, food.y);
    playCollectSound();
    placeFood();
    interval = Math.max(50, 120 - score * 2);
  } else {
    snake.pop();
  }
}

function endGame() {
  gameOver = true;
  playDeathSound();
  let isNew = false;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('spSnakeHighScore', highScore);
    highScoreEl.textContent = 'Best: ' + highScore;
    isNew = true;
  }
  document.querySelector('#gameOverCard .finalScore').textContent = 'Cheesy Poofs: ' + score;
  document.querySelector('#gameOverCard .newHigh').textContent = isNew ? 'NEW HIGH SCORE, KYLE!' : '';
  overlay.classList.add('visible');
}

// ============ DRAWING ============

// South Park background
function drawBackground() {
  // Sky
  ctx.fillStyle = '#87CEEB';
  ctx.fillRect(0, 0, W, H);

  // Mountains
  ctx.fillStyle = '#6B8E6B';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.28);
  ctx.lineTo(W * 0.08, H * 0.12);
  ctx.lineTo(W * 0.18, H * 0.22);
  ctx.lineTo(W * 0.28, H * 0.06);
  ctx.lineTo(W * 0.38, H * 0.2);
  ctx.lineTo(W * 0.48, H * 0.1);
  ctx.lineTo(W * 0.58, H * 0.24);
  ctx.lineTo(W * 0.68, H * 0.08);
  ctx.lineTo(W * 0.78, H * 0.18);
  ctx.lineTo(W * 0.88, H * 0.04);
  ctx.lineTo(W * 0.95, H * 0.16);
  ctx.lineTo(W, H * 0.26);
  ctx.lineTo(W, H * 0.35);
  ctx.lineTo(0, H * 0.35);
  ctx.closePath();
  ctx.fill();

  // Snow caps
  ctx.fillStyle = '#F0F0F0';
  ctx.beginPath();
  ctx.moveTo(W * 0.25, H * 0.08);
  ctx.lineTo(W * 0.28, H * 0.06);
  ctx.lineTo(W * 0.31, H * 0.09);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W * 0.45, H * 0.12);
  ctx.lineTo(W * 0.48, H * 0.1);
  ctx.lineTo(W * 0.51, H * 0.13);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W * 0.65, H * 0.1);
  ctx.lineTo(W * 0.68, H * 0.08);
  ctx.lineTo(W * 0.71, H * 0.11);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W * 0.85, H * 0.06);
  ctx.lineTo(W * 0.88, H * 0.04);
  ctx.lineTo(W * 0.91, H * 0.07);
  ctx.closePath();
  ctx.fill();

  // Ground
  ctx.fillStyle = '#4A8C3F';
  ctx.fillRect(0, H * 0.85, W, H * 0.15);

  // Darker ground line
  ctx.fillStyle = '#3D7334';
  ctx.fillRect(0, H * 0.85, W, 3);

  // Simple road
  ctx.fillStyle = '#555';
  ctx.fillRect(0, H * 0.88, W, H * 0.04);
  // Road dashes
  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([8, 12]);
  ctx.beginPath();
  ctx.moveTo(0, H * 0.9);
  ctx.lineTo(W, H * 0.9);
  ctx.stroke();
  ctx.setLineDash([]);

  // Subtle overlay for gameplay clarity
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W, y * CELL); ctx.stroke();
  }
}

// Cheesy Poof
function drawCheesyPoof(cx, cy, size) {
  const pulse = 1 + Math.sin(performance.now() / 200) * 0.08;
  const r = size * 0.45 * pulse;

  // Glow
  ctx.fillStyle = 'rgba(255,140,0,0.15)';
  ctx.beginPath(); ctx.arc(cx, cy, r * 2, 0, Math.PI * 2); ctx.fill();

  // Main poof body
  const grad = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.2, 0, cx, cy, r);
  grad.addColorStop(0, '#FFB347');
  grad.addColorStop(0.5, '#FF8C00');
  grad.addColorStop(1, '#CC6600');
  ctx.fillStyle = grad;

  // Bumpy circle
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i;
    const bumpR = r * (0.85 + 0.15 * Math.sin(i * 3.7 + 1));
    const bx = cx + Math.cos(angle) * bumpR;
    const by = cy + Math.sin(angle) * bumpR;
    if (i === 0) ctx.moveTo(bx, by);
    else ctx.lineTo(bx, by);
  }
  ctx.closePath();
  ctx.fill();

  // Highlight
  ctx.fillStyle = 'rgba(255,255,200,0.3)';
  ctx.beginPath();
  ctx.arc(cx - r * 0.2, cy - r * 0.25, r * 0.35, 0, Math.PI * 2);
  ctx.fill();
}

// Cartman head
function drawCartman(cx, cy, size) {
  const s = size * 0.9;
  ctx.save();
  ctx.translate(cx, cy);

  // Body / red jacket
  ctx.fillStyle = '#CC0000';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.2, s * 0.38, s * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
  // Jacket trim
  ctx.fillStyle = '#990000';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.35, s * 0.36, s * 0.1, 0, 0, Math.PI);
  ctx.fill();

  // Yellow gloves (hands at sides)
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(-s * 0.38, s * 0.22, s * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.38, s * 0.22, s * 0.09, 0, Math.PI * 2); ctx.fill();

  // Head — big round (South Park style)
  ctx.fillStyle = '#FDDCB5';
  ctx.beginPath();
  ctx.arc(0, -s * 0.12, s * 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Blue hat
  ctx.fillStyle = '#1E90FF';
  ctx.beginPath();
  ctx.arc(0, -s * 0.12, s * 0.31, Math.PI, 0, false);
  ctx.lineTo(s * 0.31, -s * 0.12);
  ctx.lineTo(-s * 0.31, -s * 0.12);
  ctx.closePath();
  ctx.fill();

  // Hat brim
  ctx.fillStyle = '#1E90FF';
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.12, s * 0.34, s * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();

  // Yellow hat stripe
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(-s * 0.31, -s * 0.22, s * 0.62, s * 0.06);

  // Hat pom-pom
  ctx.fillStyle = '#FFD700';
  ctx.beginPath(); ctx.arc(0, -s * 0.42, s * 0.07, 0, Math.PI * 2); ctx.fill();

  // Eyes — big white ovals
  ctx.fillStyle = '#FFF';
  ctx.beginPath(); ctx.ellipse(-s * 0.1, -s * 0.14, s * 0.09, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.1, -s * 0.14, s * 0.09, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();

  // Pupils
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-s * 0.08, -s * 0.13, s * 0.03, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.12, -s * 0.13, s * 0.03, 0, Math.PI * 2); ctx.fill();

  // Mouth
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.02, s * 0.08, s * 0.04, 0, 0, Math.PI * 2);
  ctx.fill();

  // Double chin area — slight shading
  ctx.fillStyle = 'rgba(200,170,130,0.3)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.1, s * 0.2, s * 0.06, 0, 0, Math.PI);
  ctx.fill();

  ctx.restore();
}

// Kenny (tail segment)
function drawKenny(cx, cy, size, t) {
  // t = 0..1 how far along tail (0 = close to head, 1 = far)
  const s = size * (0.85 - t * 0.3); // gets smaller
  ctx.save();
  ctx.translate(cx, cy);

  // Orange parka body
  ctx.fillStyle = '#FF6600';
  const darkness = t * 0.3;
  const r2 = Math.round(255 * (1 - darkness));
  const g2 = Math.round(102 * (1 - darkness));
  ctx.fillStyle = `rgb(${r2},${g2},0)`;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.12, s * 0.32, s * 0.25, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hood / head — orange circle
  ctx.beginPath();
  ctx.arc(0, -s * 0.1, s * 0.26, 0, Math.PI * 2);
  ctx.fill();

  // Hood rim — slightly darker
  ctx.strokeStyle = `rgb(${Math.round(r2*0.7)},${Math.round(g2*0.7)},0)`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -s * 0.1, s * 0.26, 0, Math.PI * 2);
  ctx.stroke();

  // Face opening — small oval
  ctx.fillStyle = '#FDDCB5';
  ctx.beginPath();
  ctx.ellipse(0, -s * 0.08, s * 0.12, s * 0.13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes — just two dots (Kenny's eyes barely visible)
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-s * 0.04, -s * 0.1, s * 0.025, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.04, -s * 0.1, s * 0.025, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function draw() {
  drawBackground();

  // Cheesy Poof
  drawCheesyPoof(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL);

  // Kenny tail (draw before Cartman head)
  for (let i = snake.length - 1; i >= 1; i--) {
    const s = snake[i];
    const t = i / Math.max(snake.length - 1, 1);
    drawKenny(s.x * CELL + CELL / 2, s.y * CELL + CELL / 2, CELL, t);
  }

  // Cartman head
  if (snake.length > 0) {
    const head = snake[0];
    const headScale = eatAnim > 0 ? CELL * 1.15 : CELL;
    drawCartman(head.x * CELL + CELL / 2, head.y * CELL + CELL / 2, headScale);
  }

  // Particles (orange poof crumbs)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.03;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating text
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.2; ft.life -= 0.016;
    if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    const fontSize = ft.text.length > 10 ? 10 : 14;
    ctx.font = `bold ${fontSize}px 'Arial Black', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  if (eatAnim > 0) eatAnim--;
}

function gameLoop(ts) {
  if (!running) return;
  if (!lastTick) lastTick = ts;
  if (ts - lastTick >= interval) {
    lastTick = ts;
    if (!gameOver) update();
  }
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  init();
  running = true;
  lastTick = 0;
  requestAnimationFrame(gameLoop);
}

// --- Input ---
function setDir(newDir) {
  if (newDir === 'up' && dir.y === 0) nextDir = { x: 0, y: -1 };
  else if (newDir === 'down' && dir.y === 0) nextDir = { x: 0, y: 1 };
  else if (newDir === 'left' && dir.x === 0) nextDir = { x: -1, y: 0 };
  else if (newDir === 'right' && dir.x === 0) nextDir = { x: 1, y: 0 };
}

document.addEventListener('keydown', (e) => {
  const key = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(key)) e.preventDefault();
  if (key === 'ArrowUp' || key === 'w') setDir('up');
  else if (key === 'ArrowDown' || key === 's') setDir('down');
  else if (key === 'ArrowLeft' || key === 'a') setDir('left');
  else if (key === 'ArrowRight' || key === 'd') setDir('right');
});

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const d = btn.dataset.dir;
  const handler = (e) => {
    e.preventDefault();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    setDir(d);
  };
  btn.addEventListener('touchstart', handler, { passive: false });
  btn.addEventListener('mousedown', handler);
});

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchStartX = t.clientX; touchStartY = t.clientY; touchStartTime = Date.now();
}, { passive: true });
canvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  if (dt > 500) return;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return;
  if (absDx > absDy) setDir(dx > 0 ? 'right' : 'left');
  else setDir(dy > 0 ? 'down' : 'up');
}, { passive: true });
document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

restartBtn.addEventListener('click', startGame);
startBtn.addEventListener('click', () => {
  startOverlay.remove();
  startGame();
});

document.fonts && document.fonts.ready.then(resizeCanvas);
</script>
